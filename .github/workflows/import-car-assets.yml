name: Import verified CC-BY car assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-car-assets.yml"
      - "mobile-racer/assets-lock.json"
      - "mobile-racer/tools/import_assets.py"
      - "mobile-racer/tools/decode_draco.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-asset-import-main
  cancel-in-progress: false

jobs:
  import-car-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out game repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install glTF decoder dependencies
        run: npm install --no-save @gltf-transform/core @gltf-transform/extensions draco3dgltf

      - name: Download, pin-check, and decode all nine cars for Godot
        run: |
          python mobile-racer/tools/import_assets.py
          node mobile-racer/tools/decode_draco.mjs

      - name: Commit models and attribution into this repository
        run: |
          git add mobile-racer/assets/cars mobile-racer/ASSET_CREDITS.md
          if git diff --cached --quiet; then
            echo "Assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import nine verified CC-BY 4.0 car models"
          git push origin HEAD:main
